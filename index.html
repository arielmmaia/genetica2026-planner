<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Planejador não oficial da programação do Genética 2026 (71º Congresso Brasileiro de Genética). Unofficial program planner.">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Unofficial Genética 2026 Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400&family=Montserrat:wght@600&display=swap">
<style>
/* Layout: teal topbar + white sticky header (as on genetica2026.com.br); Program = uppercase day switcher, vertical timeline
   with bold teal times and dots, session cards with corner tabs (room top-left, track top-right). Schedule = conflicts + time grid.
   Brand tokens from the official site: accent #029B7C, primary #020D19, secondary #E2E8E2, Onest + Inter (+ Montserrat labels). */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --surface-2:#E9EEE9; --ink:#020D19; --muted:#5F6A68; --line:#020D1917; --line-2:#DCE3DE;
  --accent:#029B7C; --accent-dark:#027A62; --accent-soft:#E0F2ED; --on-accent:#FFFFFF;
  --topbar:#029B7C; --header:#FFFFFF; --tag-grey:#6C757D;
  --danger:#D64545; --danger-bg:#FCEAEA; --warn:#94620A; --warn-bg:#FBF1DC;
  --hatch:rgba(2,13,25,.055); --shadow:0 4px 15px rgba(2,13,25,.10); --shadow-lg:0 10px 40px rgba(2,13,25,.22);
  --f-display:"Onest","Inter",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-label:"Montserrat","Inter",system-ui,sans-serif;
  --r-s1:#2E63B0; --r-s3:#1C8DB5; --r-s5:#4B4FC0;
  --r-a2:#2D8A55; --r-a4:#6C8A1E; --r-a6:#177A6B;
  --r-jur:#C4552A; --r-joa:#AD760B; --r-arm:#B63A6A; --r-rib:#8750B4;
  --r-main:#1E2B36; --r-praca:#8C6A3E; --r-post:#5E7A88; --r-off:#737B79;
  --pmm:1.15px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#020D19; --surface:#0A1726; --surface-2:#0F2031; --ink:#E7EEEB; --muted:#94A3A6; --line:#FFFFFF1A; --line-2:#1B2C3D;
  --accent:#1DB894; --accent-dark:#17A383; --accent-soft:#0B2E2C; --on-accent:#021410;
  --topbar:#027A62; --header:#061322; --tag-grey:#4B5563;
  --danger:#F07171; --danger-bg:#3A1519; --warn:#E3AE4A; --warn-bg:#2E2412;
  --hatch:rgba(231,238,235,.05); --shadow:0 4px 15px rgba(0,0,0,.35); --shadow-lg:0 10px 40px rgba(0,0,0,.55);
  --r-main:#4A5E70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#020D19; --surface:#0A1726; --surface-2:#0F2031; --ink:#E7EEEB; --muted:#94A3A6; --line:#FFFFFF1A; --line-2:#1B2C3D;
  --accent:#1DB894; --accent-dark:#17A383; --accent-soft:#0B2E2C; --on-accent:#021410;
  --topbar:#027A62; --header:#061322; --tag-grey:#4B5563;
  --danger:#F07171; --danger-bg:#3A1519; --warn:#E3AE4A; --warn-bg:#2E2412;
  --hatch:rgba(231,238,235,.05); --shadow:0 4px 15px rgba(0,0,0,.35); --shadow-lg:0 10px 40px rgba(0,0,0,.55);
  --r-main:#4A5E70; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body);margin:0;transition:background-color .25s ease,color .25s ease}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}
.label{font:600 11px/1.2 var(--f-label);letter-spacing:2px;text-transform:uppercase}

/* topbar + header, after the congress site */
.topbar{background:var(--topbar);color:#fff;font-size:12.5px}
.topbar .wrap{display:flex;flex-wrap:wrap;gap:4px 18px;padding-block:7px;align-items:center}
.topbar span{display:inline-flex;gap:6px;align-items:center;opacity:.95}
.topbar .right{margin-left:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header);box-shadow:0 0 12px rgba(2,13,25,.12);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.helix{flex:0 0 auto;color:var(--accent)}
.brand h1{font:800 23px/1 var(--f-display);letter-spacing:-.02em;margin:0;white-space:nowrap}
.brand h1 span{color:var(--accent)}
.brand small{display:block;color:var(--muted);font:500 11px/1.3 var(--f-label);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:100px;padding:4px}
.tab{border:0;background:none;padding:8px 16px;border-radius:100px;font:600 14px/1.2 var(--f-display);color:var(--muted);display:flex;align-items:center;gap:7px;transition:background-color .2s,color .2s}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.count{font:600 11.5px/1 var(--f-body);font-variant-numeric:tabular-nums;padding:3px 7px;border-radius:100px;background:var(--surface);color:var(--ink)}
.tab[aria-selected="true"] .count{background:rgba(255,255,255,.22);color:inherit}
.count.bad{background:var(--danger);color:#fff}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--accent)}
.theme{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--ink);transition:background-color .2s,color .2s}
.theme:hover{color:var(--accent);border-color:var(--accent)}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block} :root[data-theme="dark"] .theme .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme .sun{display:block} :root:not([data-theme="light"]) .theme .moon{display:none}}

main{padding-block:22px 64px}
section[hidden]{display:none}
.sechead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.sechead h2{margin:0;font:800 clamp(24px,4vw,34px)/1.05 var(--f-display);letter-spacing:-.02em}
.sechead h2 span{color:var(--accent)}
.sechead p{margin:0;color:var(--muted);font-size:14px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 280px;min-width:0;position:relative}
.search input{width:100%;padding:12px 16px 12px 42px;border-radius:100px;border:1px solid var(--line-2);background:var(--surface)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--accent)}
.toolbar select{padding:10px 14px;border-radius:100px;border:1px solid var(--line-2);background:var(--surface);max-width:100%}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;padding:9px 14px;border-radius:100px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);margin:0}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13.5px;padding:8px 4px}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:6px 0 18px;align-items:center}
.legend .grp{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.legend .grp b{color:var(--muted);margin-right:4px}
.rpill{--rc:var(--r-off);display:inline-flex;align-items:center;gap:5px;border:0;border-radius:6px;padding:3px 9px;font:600 12px/1.4 var(--f-body);background:var(--rc);color:#fff;white-space:nowrap}
.legend .rpill{transition:opacity .15s}
.legend .rpill.dim{opacity:.28}

/* day switcher: uppercase Montserrat, accent fill on the active day (site's .day-btn) */
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:5px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);margin-bottom:26px}
.day{border:0;background:none;border-radius:8px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--accent);transition:background-color .35s cubic-bezier(.19,1,.22,1),color .25s;min-width:0}
.day b{font:600 12px/1.2 var(--f-label);letter-spacing:2px;text-transform:uppercase}
.day small{font-size:11.5px;color:var(--muted)}
.day .meta{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
.day .meta .g{color:var(--accent);font-weight:600}
.day[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.day[aria-selected="true"] small,.day[aria-selected="true"] .meta,.day[aria-selected="true"] .meta .g{color:var(--on-accent);opacity:.92}

/* timeline */
#blocks{position:relative}
#blocks::before{content:"";position:absolute;left:131px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,color-mix(in oklab,var(--accent) 55%,transparent) 6%,color-mix(in oklab,var(--accent) 55%,transparent) 94%,transparent)}
.block{position:relative;display:grid;grid-template-columns:112px minmax(0,1fr);gap:40px;padding-block:14px}
.block::before{content:"";position:absolute;left:125px;top:22px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);z-index:1;transition:transform .25s,background-color .25s,box-shadow .25s}
.block:hover::before{background:var(--accent);box-shadow:0 0 12px var(--accent);transform:scale(1.35)}
.block .when{position:sticky;top:96px;align-self:start}
.when .t{font:800 17px/1.15 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.when .t i{font-style:normal;display:block;font-size:13px;font-weight:600;opacity:.75}
.when .k{margin-top:6px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.ambient-row{position:relative;display:grid;grid-template-columns:112px minmax(0,1fr);gap:40px;padding-block:8px;color:var(--muted);font-size:13.5px;align-items:center}
.ambient-row::before{content:"";position:absolute;left:128px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--line-2)}
.ambient-row .mono{font-weight:600}
.ambient-row .pill{justify-self:start;padding:4px 12px;border-radius:100px;background:var(--surface-2)}

/* session card: 2px border in room color, corner tabs like the site's .room-tag / .info-card-area */
.card{--rc:var(--r-off);position:relative;text-align:left;border:2px solid color-mix(in oklab,var(--rc) 55%,var(--surface));background:var(--surface);border-radius:8px;padding:34px 14px 12px;display:flex;flex-direction:column;gap:7px;min-width:0;overflow:hidden;box-shadow:0 2px 8px rgba(2,13,25,.05);transition:transform .15s ease,box-shadow .2s ease,border-color .2s}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--rc)}
.tab-room{position:absolute;top:0;left:0;padding:3px 10px;border-radius:0 0 6px 0;font-size:12px;font-weight:600;background:var(--rc);color:#fff;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab-area{position:absolute;top:0;right:0;padding:3px 10px;border-radius:0 0 0 6px;font-size:12px;background:var(--tag-grey);color:#fff;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3{margin:0;font:600 15px/1.32 var(--f-display);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.card .who{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.card.going{border-color:var(--rc);background:color-mix(in oklab,var(--rc) 7%,var(--surface))}
.card.maybe{border-style:dashed;border-color:var(--rc)}
.card .open{position:absolute;inset:0;border:0;background:none;border-radius:8px;padding:0}
.quick{position:relative;z-index:2;margin-left:auto;display:inline-flex;align-items:center;gap:5px;border-radius:100px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font:600 12.5px/1 var(--f-body);padding:6px 12px;transition:background-color .2s,color .2s}
.quick:hover{background:var(--accent-soft)}
.card.going .quick{background:var(--accent);color:var(--on-accent)}
.card.maybe .quick{border-style:dashed}
.chip{font:500 11px/1.5 var(--f-body);padding:1px 8px;border-radius:100px;border:1px solid var(--line-2);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip.pt{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.chip.star{border-color:var(--accent);color:var(--accent)}
.status{font:600 11px/1.5 var(--f-body);padding:2px 9px;border-radius:100px}
.status.going{background:var(--accent);color:var(--on-accent)}
.status.maybe{border:1px dashed var(--accent);color:var(--accent)}
.status.clash{background:var(--danger);color:#fff}
.empty{padding:44px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:30px;background:var(--surface)}
.empty b{display:block;color:var(--ink);font:700 19px/1.3 var(--f-display);margin-bottom:4px}

/* dialog: room color under the site's hero gradient */
dialog{border:0;padding:0;border-radius:20px;width:min(700px,calc(100vw - 24px));max-height:calc(100dvh - 32px);background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg);overflow:hidden}
dialog::backdrop{background:rgba(2,13,25,.6);backdrop-filter:blur(2px)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 32px)}
.dlg-head{--rc:var(--r-off);background:linear-gradient(90deg,rgba(2,13,25,.55) 0%,rgba(2,13,25,0) 100%),var(--rc);color:#fff;padding:18px 20px 16px;display:flex;flex-direction:column;gap:9px;position:relative}
.dlg-head .x{position:absolute;z-index:2;top:12px;right:12px;border:2px solid rgba(255,255,255,.8);background:transparent;color:#fff;width:34px;height:34px;border-radius:100px;font-size:18px;line-height:1}
.dlg-head .x:hover{background:rgba(255,255,255,.15)}
.dlg-head .eyebrow{padding-right:44px;opacity:.9}
.dlg-head h2{margin:0;font:700 22px/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance;padding-right:30px}
.dlg-head .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px}
.dlg-body{padding:18px 20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:100px;background:var(--surface-2)}
.seg button{border:0;background:none;border-radius:100px;padding:10px 6px;font:600 14px/1.2 var(--f-display);color:var(--muted);transition:background-color .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button.go[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.alert{border-radius:12px;padding:10px 14px;font-size:13.5px}
.alert.bad{background:var(--danger-bg);color:var(--danger)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.sec h4{margin:0 0 8px;color:var(--muted)}
.people{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.person{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:15px;background:var(--surface-2)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--f-display);background:var(--surface);color:var(--accent);border:2px solid var(--accent)}
.person .talk{font-weight:600;font-size:14px;line-height:1.35;font-family:var(--f-display)}
.person .nm{font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.person .af{font-size:12.5px;color:var(--muted);font-style:italic}
.role{background:var(--accent);color:var(--on-accent);padding:1px 8px;border-radius:200px;font-size:11px;font-weight:600}
.starbtn{border:1.5px solid var(--line-2);background:var(--surface);border-radius:100px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.starbtn[aria-pressed="true"]{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.note{font-size:13.5px;color:var(--muted);line-height:1.55;max-width:65ch}
textarea{width:100%;min-height:78px;border-radius:15px;border:1px solid var(--line-2);background:var(--surface-2);padding:12px;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* schedule */
.sumbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.stat{display:flex;align-items:baseline;gap:7px;background:var(--surface);border:1px solid var(--line-2);border-radius:100px;padding:8px 16px}
.stat b{font:800 22px/1 var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.bad{border-color:var(--danger);background:var(--danger-bg)} .stat.bad b,.stat.bad span{color:var(--danger)}
.spacer{flex:1}
.btn{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:100px;padding:10px 20px;font:600 14px/1.2 var(--f-display);display:inline-flex;gap:8px;align-items:center;transition:background-color .2s,color .2s}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.exportopts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;margin:-2px 0 16px;color:var(--muted)}
.exportopts select{padding:7px 12px;border-radius:100px;border:1px solid var(--line-2);background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:100px;font-size:14px;z-index:50;max-width:calc(100vw - 32px);box-shadow:var(--shadow-lg)}
.copybox{width:100%;min-height:140px;font:12px/1.4 ui-monospace,Menlo,monospace}

.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel.bad{border-color:color-mix(in oklab,var(--danger) 55%,var(--line-2))}
.panel>h3{margin:0 0 10px;font:700 17px/1.2 var(--f-display);display:flex;gap:8px;align-items:center}
.panel>h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--danger)}
.panel.hop>h3 .dot{background:var(--warn)}
.conf{border-top:1px solid var(--line-2);padding-block:12px;display:flex;flex-direction:column;gap:8px}
.conf:first-of-type{border-top:0;padding-top:2px}
.conf .hd{color:var(--accent)}
.conf .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.opt{--rc:var(--r-off);border:2px solid color-mix(in oklab,var(--rc) 55%,var(--surface));background:var(--surface);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.opt .t{font:600 14px/1.3 var(--f-display);cursor:pointer}
.opt .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.opt .keep{border:0;background:var(--accent);color:var(--on-accent);border-radius:100px;padding:6px 12px;font-weight:600;font-size:12.5px;margin-left:auto}
.opt .keep:hover{background:var(--accent-dark)}
.conf .ack{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0}
.hopline{font-size:13.5px;padding:6px 0;border-top:1px solid var(--line-2)}
.hopline:first-of-type{border-top:0}

.viewtog{display:inline-flex;gap:4px;padding:4px;border-radius:100px;background:var(--surface-2)}
.viewtog button{border:0;background:none;padding:8px 16px;border-radius:100px;font:600 13.5px/1.2 var(--f-display);color:var(--muted)}
.viewtog button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* ---------------- share codes ---------------- */
// Format: G26.<pairs> where each pick = 2 base36 chars (session index) + g|m
function makeCode(){
  const ids = Object.keys(state.picks).filter(id=>IDX[id]!==undefined).sort((a,b)=>IDX[a]-IDX[b]);
  if(!ids.length) return '';
  return 'G26.' + ids.map(id=>IDX[id].toString(36).padStart(2,'0') + (state.picks[id]==='going'?'g':'m')).join('');
}
function parseCode(txt){
  const m = String(txt||'').replace(/\s+/g,'').match(/G26\.([0-9a-z]+)/i); if(!m) return null;
  const body = m[1].toLowerCase(); if(body.length%3) return null;
  const picks = {};
  for(let i=0;i<body.length;i+=3){ const n = parseInt(body.slice(i,i+2),36), f = body[i+2]; if(!(n>=0 && n<S.length) || !'gm'.includes(f)) return null; picks[S[n].id] = f==='g'?'going':'maybe'; }
  return Object.keys(picks).length ? picks : null;
}
const friendPicks = () => (state.friend && state.friend.picks) || {};

/* ---------------- derived ---------------- */
const overlap = (a,b) => a.day===b.day && a.start<b.end && b.start<a.end;
const pairKey = (a,b) => [a,b].sort().join('|');
function analyse(){
  const going = Object.keys(state.picks).filter(id=>state.picks[id]==='going' && BY_ID[id]).map(id=>BY_ID[id]);
  const clashIds = new Set(); const adj = {};
  for(let i=0;i<going.length;i++) for(let j=i+1;j<going.length;j++){
    const a=going[i], b=going[j];
    if(overlap(a,b) && !state.acks[pairKey(a.id,b.id)]){ clashIds.add(a.id); clashIds.add(b.id); (adj[a.id]=adj[a.id]||[]).push(b.id); (adj[b.id]=adj[b.id]||[]).push(a.id); }
  }
  const groups=[]; const seen=new Set();
  [...clashIds].forEach(id=>{ if(seen.has(id)) return; const g=[]; const st=[id]; seen.add(id);
    while(st.length){ const x=st.pop(); g.push(BY_ID[x]); (adj[x]||[]).forEach(y=>{ if(!seen.has(y)){ seen.add(y); st.push(y);} }); }
    g.sort((a,b)=>a.start-b.start||a.room.localeCompare(b.room)); groups.push(g); });
  groups.sort((a,b)=>a[0].day-b[0].day||a[0].start-b[0].start);
  const hops=[]; const sorted = going.slice().sort((a,b)=>a.day-b.day||a.start-b.start);
  for(let i=0;i<sorted.length-1;i++){ const a=sorted[i], b=sorted[i+1];
    if(a.day===b.day && b.start>=a.end && b.start-a.end<=10 && ROOM_WING[a.room] && ROOM_WING[b.room] && ROOM_WING[a.room]!==ROOM_WING[b.room]) hops.push([a,b]); }
  return {going, clashIds, groups, hops};
}

/* ---------------- Program ---------------- */
function matches(s){
  if(ui.track && !s.tracks.includes(ui.track)) return false;
  if(ui.type && s.type!==ui.type) return false;
  if(ui.room && s.room!==ui.room) return false;
  if(ui.pt && s.pt) return false;
  if(ui.mine && !state.picks[s.id]) return false;
  if(ui.q){ const terms = fold(ui.q).split(/\s+/).filter(Boolean); if(!terms.every(t=>s.hay.includes(t))) return false; }
  return true;
}
const filtering = () => !!(ui.q||ui.track||ui.type||ui.room||ui.pt||ui.mine);
function renderLegend(){

}
function renderDays(){
  document.getElementById('days').innerHTML = DATA.dates.map((_,i)=>{
    const ss = S.filter(s=>s.day===i); const m = ss.filter(matches).length;
    const g = ss.filter(s=>state.picks[s.id]==='going').length, mb = ss.filter(s=>state.picks[s.id]==='maybe').length;
    return `<button class="day" role="tab" aria-selected="${ui.day===i}" data-day="${i}"><b>${esc(dayShort(i))}</b><small>${filtering()?esc(T('match')(m)):`${ss.length} ${esc(T('sessions'))}`}</small><span class="meta"><span class="g">${g} ${esc(T('going'))}</span>${mb?` · ${mb} ${esc(T('maybe'))}`:''}</span></button>`; }).join('');
}
function whoLine(s){
  const sp = s.people.filter(p=>p.role!=='Chair'); const ch = s.people.filter(p=>p.role==='Chair');
  if(!s.people.length) return s.note || '';
  const talks = sp.filter(p=>p.talk).length;
  if(talks>1) return `${talks} · ${sp.map(p=>p.name.split(' ').slice(-1)[0]).join(', ')}`;
  if(sp.length) return sp.map(p=>`${p.name}${p.aff?` (${p.aff.split(',')[0]})`:''}`).join(' · ');
  return ch.length ? tRole('Chair')+': '+ch.map(p=>p.name).join(', ') : '';
}
function cardHtml(s, clashIds){
  const st = state.picks[s.id]||''; const fr = friendPicks()[s.id];
  const starred = s.people.some((p,i)=>state.stars[s.id+'#'+i]);
  const q = st==='going' ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>${esc(T('goingB'))}` : st==='maybe' ? esc(T('maybeB')) : `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M12 5v14M5 12h14"/></svg>${esc(T('add'))}`;
  return `<article class="card ${st}" style="--rc:${rc(s.room)}">
    <span class="tab-room">${esc(tRoom(s.room)||'—')}</span>${s.tracks[0]?`<span class="tab-area" title="${esc(s.tracks.map(t=>tTrack(t)).join(', '))}">${esc(tTrack(s.tracks[0],true))}${s.tracks.length>1?' +'+(s.tracks.length-1):''}</span>`:''}
    <button class="open" data-open="${s.id}" aria-label="${esc(T('openDetails'))}: ${esc(s.title)}"></button>
    <h3>${esc(s.title)}</h3>
    ${s.series?`<div class="who" style="-webkit-line-clamp:1">${esc(s.series)}</div>`:''}
    <div class="who">${esc(whoLine(s))}</div>
    <div class="foot">${s.pt?`<span class="chip pt">${esc(T('ptOnly'))}</span>`:''}${clashIds.has(s.id)?`<span class="status clash">${esc(T('conflict'))}</span>`:''}${fr?`<span class="chip friend">${esc(state.friend.name)}: ${esc(fr==='going'?T('goingB'):T('maybeB'))}</span>`:''}${starred?`<span class="chip star">${esc(T('starred'))}</span>`:''}${state.notes[s.id]?`<span class="chip">${esc(T('note'))}</span>`:''}<button class="quick" data-quick="${s.id}" aria-label="${esc(st==='going'?T('removeAria'):T('addAria'))}">${q}</button></div>
  </article>`;
}
function renderBlocks(){
  const {clashIds} = analyse();
  const ss = S.filter(s=>s.day===ui.day && matches(s));
  const amb = filtering() ? [] : AMB.filter(a=>a.day===ui.day);
  const groups = {};
  ss.forEach(s=>{ const k = s.start+'-'+s.end+'-'+s.type; (groups[k]=groups[k]||{start:s.start,end:s.end,type:s.type,items:[]}).items.push(s); });
  const rows = Object.values(groups).map(g=>({kind:'b',...g})).concat(amb.map(a=>({kind:'a',...a})));
  rows.sort((a,b)=>a.start-b.start || (a.kind==='a')-(b.kind==='a') || a.end-b.end);
  const out = rows.map(r=> r.kind==='a'
    ? `<div class="ambient-row"><span class="mono">${hm(r.start)}–${hm(r.end)}</span><span class="pill">${esc(tAmb(r.title))}</span></div>`
    : `<div class="block"><div class="when"><div class="t">${hm(r.start)}<i>– ${hm(r.end)}</i></div><div class="k label">${esc(tType(r.type))}${r.items.length>1?` · ${r.items.length}`:''}</div></div><div class="cards">${r.items.map(s=>cardHtml(s,clashIds)).join('')}</div></div>`).join('');
  document.getElementById('blocks').innerHTML = out || `<div class="empty"><b>${esc(T('noMatch')(dayShort(ui.day)))}</b>${esc(T('noMatchHelp'))}</div>`;
  document.getElementById('f-clear').hidden = !filtering();

function layoutDay(evs){
  evs.sort((a,b)=>a.start-b.start||b.end-a.end);
  const out=[]; let cluster=[], cEnd=-1;
  const flush=()=>{ const cols=[]; cluster.forEach(e=>{ let c=cols.findIndex(end=>end<=e.start); if(c<0){c=cols.length;cols.push(0);} cols[c]=e.end; e._col=c; }); cluster.forEach(e=>{ e._n=cols.length; out.push(e); }); cluster=[]; };
  evs.forEach(e=>{ if(e.start>=cEnd && cluster.length){ flush(); cEnd=-1; } cluster.push(e); cEnd=Math.max(cEnd,e.end); });
  if(cluster.length) flush(); return out;
}
function calHtml(picks, clashIds){

  h += `<div class="axis" style="height:calc(${maxM-minM} * var(--pmm))">${Array.from({length:(maxM-minM)/60},(_,k)=>`<span style="top:calc(${k*60} * var(--pmm) + 6px)">${hm(minM+k*60)}</span>`).join('')}</div>`;
  DATA.dates.forEach((_,i)=>{
    const amb = AMB.filter(a=>a.day===i && a.end-a.start<=180).map(a=>`<div class="amb" style="top:${px(a.start)};height:calc(${a.end-a.start} * var(--pmm))">${esc(tAmb(a.title))}</div>`).join('');
    const evs = layoutDay(picks.filter(p=>p.day===i).map(p=>({...p})));
    const evh = evs.map(e=>{ const st = e._friend ? 'friend' : state.picks[e.id]; const w=100/e._n; const clash=!e._friend && clashIds.has(e.id);
      return `<button class="ev ${st} ${clash?'clash':''}" data-open="${e.id}" style="--rc:${rc(e.room)};top:calc(${px(e.start)} + 1px);height:calc(${e.end-e.start} * var(--pmm) - 2px);left:calc(${e._col*w}% + 2px);width:calc(${w}% - 4px)">${clash?`<span class="flag">${esc(T('conflict').toUpperCase())}</span>`:''}${e._friend?`<span class="fb">${esc(fname)}</span>`:''}<span class="em">${hm(e.start)}–${hm(e.end)} · ${esc(tRoom(e.room))}</span><span class="et">${esc(e.title)}</span></button>`; }).join('');
    h += `<div class="col" style="height:calc(${maxM-minM} * var(--pmm))">${amb}${evh}</div>`;
  });
  return h + '</div></div>';

/* ---------------- ICS + zip ---------------- */
function icsEscape(t){ return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function fold75(line){ const enc = new TextEncoder(); if(enc.encode(line).length<=75) return line; const parts=[]; let cur='', bytes=0, limit=75;
  for(const ch of line){ const b=enc.encode(ch).length; if(bytes+b>limit){ parts.push(cur); cur=''; bytes=0; limit=74; } cur+=ch; bytes+=b; } parts.push(cur); return parts.join('\r\n '); }
function utcStamp(dateIso, minutes){ const [y,m,d]=dateIso.split('-').map(Number); return new Date(Date.UTC(y,m-1,d,0,minutes+180)).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
function buildIcs(){
  const L10 = T('ics'); const incMaybe = state.prefs.maybe!==false; const alarm = Number(state.prefs.alarm||0);
  const ids = Object.keys(state.picks).filter(id=>BY_ID[id] && (state.picks[id]==='going' || (incMaybe && state.picks[id]==='maybe')));
  const now = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Genetica 2026 unofficial planner//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Genética 2026','X-WR-TIMEZONE:America/Sao_Paulo'];
  ids.map(id=>BY_ID[id]).sort((a,b)=>a.day-b.day||a.start-b.start).forEach(s=>{
    const st = state.picks[s.id]; const desc = [`${tType(s.type)}${s.series?' · '+s.series:''}`];
    if(s.tracks.length) desc.push(L10.track+': '+s.tracks.map(t=>tTrack(t)).join(', '));
    if(s.pt) desc.push(L10.ptOnly);
    const chairs = s.people.filter(p=>p.role==='Chair'); if(chairs.length) desc.push(L10.chair+': '+chairs.map(p=>p.name+(p.aff?` (${p.aff})`:'')).join('; '));
    const spk = s.people.filter(p=>p.role!=='Chair');
    if(spk.length){ desc.push(''); spk.forEach(p=>{ const k=s.people.indexOf(p); desc.push(`${state.stars[s.id+'#'+k]?'★ ':'• '}${p.talk?p.talk+' — ':''}${p.name}${p.aff?` (${p.aff})`:''}`); }); }
    if(s.note) desc.push('', s.note);
    if(state.notes[s.id]) desc.push('', L10.notes+': '+state.notes[s.id]);
    L.push('BEGIN:VEVENT', `UID:${s.id}@genetica2026-planner`, `DTSTAMP:${now}`, `DTSTART:${utcStamp(DATA.dates[s.day], s.start)}`, `DTEND:${utcStamp(DATA.dates[s.day], s.end)}`,
      'SUMMARY:'+icsEscape((st==='maybe'?L10.maybe:'')+s.title), 'LOCATION:'+icsEscape(`${tRoomFull(s.room)} — ${L10.loc}`),
      'DESCRIPTION:'+icsEscape(desc.join('\n')), `STATUS:${st==='going'?'CONFIRMED':'TENTATIVE'}`, `TRANSP:${st==='going'?'OPAQUE':'TRANSPARENT'}`, 'CATEGORIES:'+icsEscape(tType(s.type)));
    if(alarm>0) L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(s.title),`TRIGGER:-PT${alarm}M`,'END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return {text: L.map(fold75).join('\r\n')+'\r\n', count: ids.length};
}
const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipOne(name, text){
  const enc=new TextEncoder(); const data=enc.encode(text), nm=enc.encode(name), crc=crc32(data);
  const d=new Date(); const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF, dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const put=(dv,arr)=>arr.forEach(([o,v,s])=>s===4?dv.setUint32(o,v,true):dv.setUint16(o,v,true));
  const lh=new DataView(new ArrayBuffer(30)); put(lh,[[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,dt,2],[12,dd,2],[14,crc,4],[18,data.length,4],[22,data.length,4],[26,nm.length,2],[28,0,2]]);
  const cd=new DataView(new ArrayBuffer(46)); put(cd,[[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,dt,2],[14,dd,2],[16,crc,4],[20,data.length,4],[24,data.length,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,0,4]]);
  const end=new DataView(new ArrayBuffer(22)); put(end,[[0,0x06054b50,4],[4,0,2],[6,0,2],[8,1,2],[10,1,2],[12,46+nm.length,4],[16,30+nm.length+data.length,4],[20,0,2]]);
  return new Blob([lh.buffer,nm,data,cd.buffer,nm,end.buffer],{type:'application/zip'});
}
async function exportIcs(){

    catch(e){ if(e && e.code==='declined') return; if(e && e.code==='rate_limited'){ toast(T('promptOpen')); return; } showCopy(text); toast(T('saveUnavailable')); }

  catch(e){ showCopy(text); }
}

document.getElementById('dlg').addEventListener('close', ()=>{ openId=null; });
let noteTimer; document.addEventListener('input', e=>{
  if(e.target.id==='note-input'){ const v=e.target.value, id=openId; clearTimeout(noteTimer); noteTimer=setTimeout(()=>{ if(!id) return; if(v.trim()) state.notes[id]=v; else delete state.notes[id]; commit(); }, 500); }
});
const bindF = (id,key,checked) => document.getElementById(id).addEventListener(checked?'change':'input', e=>{ ui[key]= checked ? e.target.checked : e.target.value; renderLegend(); renderDays(); renderBlocks(); });
bindF('q','q'); bindF('f-track','track'); bindF('f-type','type'); bindF('f-room','room'); bindF('f-pt','pt',true); bindF('f-mine','mine',true);
document.getElementById('x-maybe').addEventListener('change', e=>{ state.prefs.maybe=e.target.checked; commit(); });
document.getElementById('x-alarm').addEventListener('change', e=>{ state.prefs.alarm=Number(e.target.value); commit(); });

/* theme + language */
const THEME_KEY='genetica2026-public-theme', LANG_KEY='genetica2026-public-lang';
function effectiveTheme(){ const a=document.documentElement.getAttribute('data-theme'); if(a==='dark'||a==='light') return a; return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); }
try{ const t=localStorage.getItem(THEME_KEY); applyTheme(t==='dark'||t==='light'?t:effectiveTheme()); }catch(e){ applyTheme(effectiveTheme()); }
document.getElementById('theme').addEventListener('click', ()=>{ const t = effectiveTheme()==='dark'?'light':'dark'; applyTheme(t); try{ localStorage.setItem(THEME_KEY,t); }catch(e){} });
function setLang(l, remember){ LANG=l; if(remember){ try{ localStorage.setItem(LANG_KEY,l); }catch(e){} } applyStatic(); renderAll(); }
(function initLang(){ let l=null; try{ l=localStorage.getItem(LANG_KEY); }catch(e){}
  if(l!=='pt' && l!=='en'){ const langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language||'en']); l = /^pt\b/i.test(langs[0]||'') ? 'pt' : 'en'; }
  LANG=l; })();

loadLocal();
try{ if(!localStorage.getItem(LS_KEY)) document.getElementById('help').open = true; }catch(e){ document.getElementById('help').open = true; }
applyStatic(); renderAll(); if(ui.tab==='plan') scrollCalToToday();
</script>

</body>
